<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento Jurídico - Alumnos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .contenedor { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea, select, button { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .alumno-card { border-left: 5px solid #007bff; background: #f9f9f9; padding: 12px; margin-bottom: 12px; border-radius: 4px; }
        .historial { font-size: 0.9em; color: #555; background: white; padding: 8px; border: 1px dashed #ccc; margin-top: 8px; white-space: pre-line; }
        .dato { margin: 3px 0; }
        .etiqueta { font-weight: bold; color: #333; }
        hr { margin: 20px 0; }
        .obligatorio { border: 2px solid #dc3545 !important; }
        .buscador { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .buscador input { margin: 0; flex: 1; }
        .buscador button { width: auto; margin: 0; padding: 8px 15px; background-color: #6c757d; }
        .buscador button:hover { background-color: #5a6268; }
        .aviso { font-size: 0.85em; color: #dc3545; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Registro de Alumnos Derivados (Jurídico)</h2>
    <p class="aviso">Los campos con borde rojo son obligatorios.</p>
    
    <!-- Formulario para agregar alumno -->
    <input type="text" id="nombre" placeholder="Nombre completo del alumno *" class="obligatorio">
    <input type="text" id="cuenta" placeholder="Número de cuenta *" class="obligatorio">
    <input type="email" id="correoAlumno" placeholder="Correo del alumno">
    <input type="text" id="telefono" placeholder="Teléfono del alumno">
    
    <hr>
    
    <input type="text" id="tutor" placeholder="Nombre del tutor *" class="obligatorio">
    <input type="email" id="correoTutor" placeholder="Correo del tutor">
    <input type="text" id="telefonoTutor" placeholder="Teléfono del tutor *" class="obligatorio">
    
    <hr>
    
    <input type="text" id="referido" placeholder="Quién lo deriva (ej. Lic. García) *" class="obligatorio">
    <input type="date" id="fecha">
    <textarea id="accion" placeholder="Acción inmediata / Nota inicial (ej. Se recibió reporte de jurídico)"></textarea>
    
    <button onclick="guardarAlumno()">Guardar Registro</button>

    <hr>

    <h3>Listado de Alumnos</h3>
    
    <!-- Buscador -->
    <div class="buscador">
        <input type="text" id="busqueda" placeholder="Buscar por nombre, cuenta, tutor o correo..." oninput="mostrarAlumnos()">
        <button onclick="limpiarBusqueda()">Limpiar</button>
    </div>

    <div id="listaAlumnos"></div>
</div>

<script>
    // 1. Cargar datos al abrir la página
    let alumnos = JSON.parse(localStorage.getItem('alumnosJuridico')) || [];

    // 2. Función para mostrar los datos en pantalla (con filtro de búsqueda)
    function mostrarAlumnos() {
        const contenedor = document.getElementById('listaAlumnos');
        const textoBusqueda = document.getElementById('busqueda').value.toLowerCase().trim();
        contenedor.innerHTML = '';

        if (alumnos.length === 0) {
            contenedor.innerHTML = '<p>No hay alumnos registrados aún.</p>';
            return;
        }

        // Filtrar alumnos según la búsqueda
        const filtrados = alumnos
            .map((alumno, indice) => ({ alumno, indice }))
            .filter(({ alumno }) => {
                if (textoBusqueda === '') return true;
                const campos = [
                    alumno.nombre,
                    alumno.cuenta,
                    alumno.tutor,
                    alumno.correoAlumno,
                    alumno.correoTutor,
                    alumno.referido
                ];
                return campos.some(campo => (campo || '').toLowerCase().includes(textoBusqueda));
            });

        if (filtrados.length === 0) {
            contenedor.innerHTML = '<p>No se encontraron alumnos con ese criterio de búsqueda.</p>';
            return;
        }

        filtrados.forEach(({ alumno, indice }) => {
            const div = document.createElement('div');
            div.className = 'alumno-card';
            div.innerHTML = `
                <div class="dato"><span class="etiqueta">Alumno:</span> ${alumno.nombre || ''}</div>
                <div class="dato"><span class="etiqueta">Número de cuenta:</span> ${alumno.cuenta || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Correo alumno:</span> ${alumno.correoAlumno || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Teléfono alumno:</span> ${alumno.telefono || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Tutor:</span> ${alumno.tutor || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Correo tutor:</span> ${alumno.correoTutor || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Teléfono tutor:</span> ${alumno.telefonoTutor || 'No registrado'}</div>
                <div class="dato"><span class="etiqueta">Referido por:</span> ${alumno.referido || ''}</div>
                <div class="dato"><span class="etiqueta">Fecha de ingreso:</span> ${alumno.fecha || ''}</div>
                <div class="historial"><strong>Historial de acciones:</strong><br>${alumno.accion || ''}</div>
                <button onclick="agregarSeguimiento(${indice})" style="width: auto; margin-top:8px; font-size:0.8em; background-color: #28a745;">+ Añadir Acción/Cita</button>
                <button onclick="borrarAlumno(${indice})" style="width: auto; margin-top:8px; font-size:0.8em; background-color: #dc3545;">Eliminar</button>
            `;
            contenedor.appendChild(div);
        });
    }

    // 3. Función para guardar un alumno nuevo (con validación de obligatorios)
    function guardarAlumno() {
        const nombre = document.getElementById('nombre').value.trim();
        const cuenta = document.getElementById('cuenta').value.trim();
        const correoAlumno = document.getElementById('correoAlumno').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const tutor = document.getElementById('tutor').value.trim();
        const correoTutor = document.getElementById('correoTutor').value.trim();
        const telefonoTutor = document.getElementById('telefonoTutor').value.trim();
        const referido = document.getElementById('referido').value.trim();
        const fecha = document.getElementById('fecha').value;
        const accion = document.getElementById('accion').value.trim();

        // Validación de campos obligatorios
        const faltantes = [];
        if (nombre === '') faltantes.push('Nombre del alumno');
        if (cuenta === '') faltantes.push('Número de cuenta');
        if (tutor === '') faltantes.push('Nombre del tutor');
        if (telefonoTutor === '') faltantes.push('Teléfono del tutor');
        if (referido === '') faltantes.push('Quién lo deriva');

        if (faltantes.length > 0) {
            alert('Faltan los siguientes campos obligatorios:\n- ' + faltantes.join('\n- '));
            return;
        }

        const nuevoAlumno = {
            nombre: nombre,
            cuenta: cuenta,
            correoAlumno: correoAlumno,
            telefono: telefono,
            tutor: tutor,
            correoTutor: correoTutor,
            telefonoTutor: telefonoTutor,
            referido: referido,
            fecha: fecha,
            accion: accion ? `Ingreso ${fecha || ''}: ${accion}` : `Ingreso ${fecha || ''}`
        };

        alumnos.push(nuevoAlumno);
        localStorage.setItem('alumnosJuridico', JSON.stringify(alumnos));

        // Limpiar formulario
        document.getElementById('nombre').value = '';
        document.getElementById('cuenta').value = '';
        document.getElementById('correoAlumno').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('tutor').value = '';
        document.getElementById('correoTutor').value = '';
        document.getElementById('telefonoTutor').value = '';
        document.getElementById('referido').value = '';
        document.getElementById('fecha').value = '';
        document.getElementById('accion').value = '';

        mostrarAlumnos();
    }

    // 4. Función para agregar una acción extra (citas/notas)
    function agregarSeguimiento(indice) {
        const nuevaAccion = prompt("Escribe la nueva acción o cita (ej. 'Cita agendada para el 15/11'):");
        if (nuevaAccion && nuevaAccion.trim() !== '') {
            const fechaHoy = new Date().toLocaleDateString();
            alumnos[indice].accion = (alumnos[indice].accion || '') + `\n${fechaHoy}: ${nuevaAccion.trim()}`;
            localStorage.setItem('alumnosJuridico', JSON.stringify(alumnos));
            mostrarAlumnos();
        }
    }

    // 5. Función para borrar
    function borrarAlumno(indice) {
        if (confirm('¿Seguro que quieres eliminar este registro?')) {
            alumnos.splice(indice, 1);
            localStorage.setItem('alumnosJuridico', JSON.stringify(alumnos));
            mostrarAlumnos();
        }
    }

    // 6. Limpiar buscador
    function limpiarBusqueda() {
        document.getElementById('busqueda').value = '';
        mostrarAlumnos();
    }

    mostrarAlumnos();
</script>

</body>
</html>
